# All images used here publish both linux/amd64 and linux/arm64 variants.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the backend talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Column store for the events (logs): fast summaries over many rows, compressed, auto-expiring.
  # Postgres keeps the small data that changes (users, keys, alerts). Not published to the host.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logmgmt}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logmgmt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d/small-server.xml:/etc/clickhouse-server/config.d/small-server.xml:ro
      - ./clickhouse/users.d/limits.xml:/etc/clickhouse-server/users.d/limits.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Receives every log (JSON API, file upload, syslog from Vector), normalizes it and stores it
  # in ClickHouse. Written in Go: it's the one part that handles every single log. Not published:
  # Caddy and Vector reach it on the compose network.
  ingest:
    build: ./ingest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      # The backend creates the ClickHouse tables at startup, so wait for it before writing.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ingest", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  vector:
    image: timberio/vector:0.46.1-alpine
    env_file: .env   # for SYSLOG_INGEST_TOKEN
    volumes:
      - ./ingest/vector.yaml:/etc/vector/vector.yaml:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    ports:
      # Syslog from firewalls / network devices. Syslog has no authentication, so on a public
      # (SaaS) server set SYSLOG_BIND=127.0.0.1, or allow 514 only from device IPs in the cloud firewall.
      - "${SYSLOG_BIND:-0.0.0.0}:514:514/udp"
      - "${SYSLOG_BIND:-0.0.0.0}:514:514/tcp"
    depends_on:
      - ingest
    restart: unless-stopped

  # Optional live demo traffic (off unless COMPOSE_PROFILES=demo): realistic events for both demo
  # tenants plus an attack every 15 minutes (brute force, port scan, malware in turn), so a public demo never looks empty.
  # It talks to the ingest service and Vector directly on the compose network, like a log shipper would.
  simulator:
    image: python:3.12-alpine
    profiles: ["demo"]
    volumes:
      - ./samples:/samples:ro
    command: >-
      python -u /samples/simulator.py --url http://ingest:8080 --keys ${SEED_API_KEYS}
      --syslog vector:514 --rate 0.3 --daily-cycle --attack-every 900
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  # Runs the Go tests (`make test`); never started by `make up`.
  ingest-test:
    image: golang:1.23-alpine
    profiles: ["test"]
    env_file: .env   # the ClickHouse tests write to the real database, like the pytest suite
    volumes:
      - .:/repo:ro          # the tests read /repo/samples too
      - gomod:/go/pkg/mod   # downloaded modules, kept between runs
      - gocache:/root/.cache/go-build
    working_dir: /repo/ingest
    command: ["go", "test", "-count=1", "./..."]

  caddy:
    image: caddy:2.10-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist certificates and Caddy's local CA so the browser trust survives restarts
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ingest
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  caddy_data:
  caddy_config:
  gomod:
  gocache:
